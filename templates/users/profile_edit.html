{% extends "base.html" %}

{% block title %}Редактирование профиля — Taskly{% endblock %}

{% block content %}
<div class="container container--narrow">
    <div class="card">
        <h1 class="card__title">Редактирование профиля</h1>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% include "partials/_form_fields.html" %}
            <div class="btn-row">
                <button class="btn btn--primary" type="submit">Сохранить</button>
                <a class="btn btn--ghost" href="{% url 'users:profile' user.pk %}">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
