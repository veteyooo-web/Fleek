{% extends "base.html" %}

{% block title %}Удалить отзыв — Taskly{% endblock %}

{% block content %}
<div class="container container--narrow">
    <div class="card">
        <h1 class="page-title">Удалить отзыв?</h1>
        <p class="muted">Отзыв от {{ review.rating }}★ о {{ review.target.display_name }} будет удалён безвозвратно.</p>
        <form method="post">
            {% csrf_token %}
            <div class="btn-row">
                <button class="btn btn--danger" type="submit">Удалить отзыв</button>
                <a class="btn btn--ghost" href="{% url 'users:profile' review.target.pk %}">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
