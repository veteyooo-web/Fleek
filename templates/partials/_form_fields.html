{% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
{% for field in form.visible_fields %}
    <div class="form-row{% if field.errors %} form-row--error{% endif %}">
        <label class="form-label" for="{{ field.id_for_label }}">
            {{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}<div class="form-help">{{ field.help_text }}</div>{% endif %}
        {% for error in field.errors %}<div class="form-error">{{ error }}</div>{% endfor %}
    </div>
{% endfor %}
