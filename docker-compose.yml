services:
  db:
    image: postgres:16-alpine
    container_name: taskly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskly}
      POSTGRES_USER: ${POSTGRES_USER:-taskly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskly} -d ${POSTGRES_DB:-taskly}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: taskly_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-taskly}
      POSTGRES_USER: ${POSTGRES_USER:-taskly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskly}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./media:/app/media
    ports:
      - "8000:8000"

volumes:
  postgres_data:
